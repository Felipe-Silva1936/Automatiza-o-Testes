name: "CI – Automação de Testes"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1-5"   # Segunda a sexta às 06:00 UTC
  workflow_dispatch:

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  api-tests:
  # ────────────────────────────────────────────────────────────────────────────
    name: "🔌 Testes de API (Petstore)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: petstore-api-tests

    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://petstore.swagger.io/v2' }}
      TIMEOUT:  ${{ vars.TIMEOUT  || '30' }}

    steps:

      - name: "📥 Checkout do repositório"
        uses: actions/checkout@v4

      - name: "🐍 Configurar Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "📦 Instalar dependências"
        working-directory: .
        run: pip install -r requirements.txt

      - name: "📁 Criar diretório de relatórios"
        run: mkdir -p reports

      - name: "🧪 Executar testes de API"
        run: |
          pytest tests/ \
            --html=reports/report.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/report.json \
            -v \
            --tb=short

      - name: "📊 Publicar resumo – API"
        if: always()
        run: |
          echo "## 🔌 Resultado dos Testes de API" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/report.json ]; then
            PASSED=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(d['summary'].get('passed', 0))")
            FAILED=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(d['summary'].get('failed', 0))")
            TOTAL=$(python3  -c "import json; d=json.load(open('reports/report.json')); print(d['summary'].get('total',  0))")
            DURATION=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(round(d.get('duration', 0), 2))")
            echo "| ✅ Passaram | ❌ Falharam | 🔢 Total | ⏱ Duração |"    >> $GITHUB_STEP_SUMMARY
            echo "|:-----------:|:-----------:|:--------:|:---------:|"     >> $GITHUB_STEP_SUMMARY
            echo "| $PASSED     | $FAILED     | $TOTAL   | ${DURATION}s |"  >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ Arquivo de relatório não encontrado." >> $GITHUB_STEP_SUMMARY
          fi

      - name: "📤 Upload – Relatório HTML (API)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "api-report-html-${{ github.run_number }}"
          path: petstore-api-tests/reports/report.html
          retention-days: 30

      - name: "📤 Upload – Relatório JSON (API)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "api-report-json-${{ github.run_number }}"
          path: petstore-api-tests/reports/report.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  web-tests:
  # ────────────────────────────────────────────────────────────────────────────
    name: "🌐 Testes Web E2E (SauceDemo)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: saucedemo-web-tests

    env:
      BASE_URL:          ${{ vars.BASE_URL_WEB     || 'https://www.saucedemo.com' }}
      STANDARD_USER:     ${{ secrets.STANDARD_USER || 'standard_user' }}
      LOCKED_USER:       ${{ secrets.LOCKED_USER   || 'locked_out_user' }}
      PASSWORD:          ${{ secrets.PASSWORD       || 'secret_sauce' }}
      HEADLESS:          "true"
      IMPLICIT_WAIT:     "10"
      PAGE_LOAD_TIMEOUT: "20"

    steps:

      - name: "📥 Checkout do repositório"
        uses: actions/checkout@v4

      - name: "🐍 Configurar Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "📦 Instalar dependências Python"
        working-directory: .
        run: pip install -r requirements.txt

      - name: "🌐 Setup Chrome"
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: "🔧 Setup ChromeDriver"
        uses: nanasess/setup-chromedriver@master

      - name: "🔍 Verificar versões instaladas"
        run: |
          google-chrome --version
          chromedriver --version

      - name: "📁 Criar diretório de relatórios"
        run: mkdir -p reports

      - name: "🧪 Executar testes Web E2E"
        run: |
          pytest tests/ \
            --html=reports/report.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/report.json \
            -v \
            --tb=short

      - name: "📊 Publicar resumo – Web"
        if: always()
        run: |
          echo "## 🌐 Resultado dos Testes Web E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/report.json ]; then
            PASSED=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(d['summary'].get('passed', 0))")
            FAILED=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(d['summary'].get('failed', 0))")
            TOTAL=$(python3  -c "import json; d=json.load(open('reports/report.json')); print(d['summary'].get('total',  0))")
            DURATION=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(round(d.get('duration', 0), 2))")
            echo "| ✅ Passaram | ❌ Falharam | 🔢 Total | ⏱ Duração |"    >> $GITHUB_STEP_SUMMARY
            echo "|:-----------:|:-----------:|:--------:|:---------:|"     >> $GITHUB_STEP_SUMMARY
            echo "| $PASSED     | $FAILED     | $TOTAL   | ${DURATION}s |"  >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ Arquivo de relatório não encontrado." >> $GITHUB_STEP_SUMMARY
          fi

      - name: "📤 Upload – Relatório HTML (Web)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "web-report-html-${{ github.run_number }}"
          path: saucedemo-web-tests/reports/report.html
          retention-days: 30

      - name: "📤 Upload – Relatório JSON (Web)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "web-report-json-${{ github.run_number }}"
          path: saucedemo-web-tests/reports/report.json
          retention-days: 30