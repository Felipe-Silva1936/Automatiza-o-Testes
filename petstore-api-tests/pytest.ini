[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/report.json

markers =
    pet: Tests for Pet endpoints
    store: Tests for Store endpoints
    user: Tests for User endpoints
    smoke: Smoke tests (critical path only)
